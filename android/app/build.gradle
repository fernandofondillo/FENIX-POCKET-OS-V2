plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ai.quyriux.fenix_pocket_os"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // A.G.O.S. V2: Cargar configuración de firma
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    // JVM Toolchain: fuerza a TODAS las tareas (Java + Kotlin) a usar 17
    // Resuelve "Inconsistent JVM-target compatibility" en tflite_flutter
    kotlin {
        jvmToolchain(17)
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ai.quyriux.fenix_pocket_os"
        // A.G.O.S. V2: minSdk 26 requerido por tflite_flutter
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // A.G.O.S. V2: Firma de release para distribución Ad Hoc / Play Store
            signingConfig = signingConfigs.release
            // tflite_flutter tiene dependencias nativas que R8 no resuelve
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
